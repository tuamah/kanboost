name: Optional C++ extension (build + correctness)

# Verifies kanboost's OPTIONAL native accelerator (kanboost/_native/ga2m_ext.cpp,
# see AI_REVIEW_LOOP.md CC-21 and setup.py) actually builds and produces
# correct results on Linux and macOS -- separate from tests.yml (which
# always runs against the pure-Python path) so a failure here never
# blocks the main test suite; this extension is not part of the
# published PyPI wheel and kanboost works fully without it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install kanboost + build-time deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pybind11

      - name: Build the optional C++ extension
        run: python setup.py build_ext --inplace

      - name: Verify the extension actually built (fail loudly here, not silently)
        run: |
          python -c "
          from kanboost.train.ga2m import _cpp_ext
          assert _cpp_ext is not None, 'kanboost._ga2m_cpp did not build/import -- see build_ext output above'
          print('kanboost._ga2m_cpp built and imported successfully:', _cpp_ext.__doc__)
          "

      - name: Run full test suite (exercises the C++-vs-Python correctness checks in tests/test_ga2m.py)
        run: pytest tests/ -q
